# Publishes data/ as this repo's GitHub Pages site — the "data site" the
# client fetches daily shards from at runtime (VITE_DATA_BASE_URL).
#
# Runs when data/daily changes on main — but NOT automatically after the daily
# workflow's commit: that commit is pushed with GITHUB_TOKEN, and GitHub never
# triggers workflows from events raised by GITHUB_TOKEN (it would allow infinite
# recursion). daily-data.yml therefore dispatches this workflow explicitly once
# its push is done, which is the one exception GitHub allows. The push trigger
# below still covers a human pushing data/ by hand.
#
# Do not "fix" this by expecting the daily commit to trigger us: it will look
# like the cron job silently stopped updating the data site, because the shards
# do change in git while Pages keeps serving the previous deployment.
#
# GitHub Pages serves the files with `Access-Control-Allow-Origin: *`, so the
# client's cross-origin fetch of data/daily/*.json works without a proxy.
#
# `enablement: true` below turns Pages on via the API on the first run, so no
# manual Settings → Pages step is needed (this is the only repo whose Pages the
# workflow publishes). The site URL is
# https://mrhumildad.github.io/cepdata/ → data at .../daily/index.json

name: deploy data site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enables the Pages site if it does not exist yet (needs pages: write).
          enablement: true

      - name: Upload data site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./data

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy data site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
